<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winnipeg Open Data Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="">
            <form id="mySearchForm">
                <input type="text" id="searchInput" name="query" placeholder="Search...">
                <button type="submit">Search</button>
            </form>

            <table id="mySearchTable">
                <th>
                    <tr>
                        <th>Street</th>
                        <th>Issue Date</th>
                        <th>Violation</th>
                        <th>Discounted Fine</th>
                        <th>Full Fine</th>
                    </tr>
                </th>
                <tbody></tbody>
            </table>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
