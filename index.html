<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winnipeg Parking Violation Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="header"></header>
    
    <main>
        <div class="search">
            <form id="mySearchForm">
                <label for="searchInput">Search by street name:</label>
                <input type="text" id="searchInput" name="query" placeholder="Enter street name">
                <button type="submit">Search</button>
            </form>
        </div>

            <div class ="table" id="tableSection"> 
                <table id="mySearchTable">
                    <thead>
                        <tr>
                            <th>Street</th>
                            <th>Issue Date</th>
                            <th>Violation</th>
                            <th>Discounted Fine</th>
                            <th>Full Fine</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
